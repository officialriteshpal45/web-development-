<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatong Tag</title>
</head>
<body>
    <!-- Formating Tag :- There are two type of formating tag  -->
    <!-- 1.Logical Tag -->
     <strong>FORMATING</strong>
     <br>
     <em>Lorem ipsum dolor sit amet.</em>
    <!-- 2.Physical Tag -->
     <i> Italic Tag </i>
    <br>
    <small> Small Tag </small>  
    <br>
    <ins> Inserted Text </ins>
    <br> 
    <sub> Subscript Tag </sub>
    <!-- Use On sup tag -->
     <p>H<sub>2</sub>O</p>
    <br>
    <strong> Strong Tag </strong>
    <br>
    <b> Bold Tag </b>
    <br>
    <mark> Mark Tag </mark>

    <p>4<sup>2</sup>:= 16</p>
</body>
</html>
