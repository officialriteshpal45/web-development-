<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute Tag </title>
</head>
<body>
    <!--This is a image attribute.-->
    <img src="https://tpc.googlesyndication.com/simgad/7745280897384278808" alt="A beautiful scenery" width="500" height="300">
    <!-- src is the relative url of the image (choice according to you  ) -->

     <!-- Anchor Tag Attribute -->
      <!-- this tag you can use your go on the random page isert link in inside the href -->
    <a href="https://www.geeksforgeeks.org/">Geeks for geeks</a>

    <!-- Class Attribute -->
     <p class="some">Lorem ipsum dolor sit amet consectetur adipisicing elit. Odio qui voluptate consequuntur, excepturi aliquid doloribus ad quod temporibus corrupti, nostrum eaque quam quia reiciendis asperiores fugit eligendi ratione voluptatibus natus?</p>

     <!-- ID Attribute -->
     <p id="id">Lorem</p>

     <!-- Style Attribute -->
      <p style="color: aqua;">Lorem ipsum dolor sit amet.</p>

</body>
</html>
