<!DOCTYPE html>
<html lang="en">
<head>

    <title>Table Creation in Html </title>
</head>
<body>

       <center>
          <table border="">

             <th colspan="3"> Student Table </th>
        </tr>
        <tr>
            <th> Name </th>
            <th> University No </th>

        </tr>
        <tr>
            <th> Faiz </th>

        </tr>
           </table>
        </center>
</body>
</html>
