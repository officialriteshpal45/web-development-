<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Form Page </title> 
</head>
<body>
    <!-- Form Tag Using to create log in page , Register page etc  -->
    <!-- Action Attribute :- what action will be perform the form -->
     <form action="form"></form>

    <!--Input in form Element  -->
    <input type="text"placeholder=" Enter your Name " >

    <!-- Label Tag -->
     <label for="id1"> class 
        <input type="checkbox" value="Class x"name="class10"id="id1">
     </label>
     <br>
     <label for="id2"> class 
        <input type="text" value="Class xii"name="class12"id="id2">
     </label>
     <br>
     <br>
     <!-- Type is a attribute user can be pass the type of data :- Text, redio,checkbox etc. -->
    
     <!-- Textarea :- basic information or feedback of the form-->
      <textarea name="text" id="no">Lorem ipsum dolor sit amet.</textarea>

      <!-- Select :- Select tag use to select the multiple city and some of user according data -->
      <br> 
      <select name="city" id="city">
        <option value="Delhi">Delhi</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Kanpur">Kanpur</option>
        <option value="Jaunpur">Jaunpur</option>
       </select>
    <br>
    <!-- Iframe :- include Frame for any website-->
     <iframe src="https://s.yimg.com/zb/imgv1/576ce588-66b3-3980-8984-71cffd276a9c/t_500x300" frameborder="0"height="1500"width="150"></iframe>
    <br>
    <!-- Video :- Add any video for your web page to use in video tag  -->
     <video height="100px"width="350px"control="">
        <source src="add your video link" type="mp4.video">
     </video>
</body>
</html>
