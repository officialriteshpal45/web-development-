<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Element </title>
</head>
<body>
    <!-- There are two type of list is html ( Order and Unorder ) -->
     <h3>Order List</h3>
    <li>
        <h2> Fruit List </h2>
        <ol type="A">
            <li> Banana </li>
            <li> Mango </li>
            <li> Litchi </li>
            <li> Pineapple </li>
        </ol>
    </li>
    <h3> Un-order List </h3>
    <li>
        <h2>Study Material</h2>
        <ul type="">
            <li> Pen </li>
            <li> Notebook </li>
            <li> Box  </li>
            <li> Scale </li>
        </ul>
    </li>
</body>
</html>
