<html lang="en">

    <title>Page Layout Design In HTML </title>
</head>
<body>
    <!-- Pre Tag :- Used to display text as it is (Without Ignoring Space & next line) -->
     <pre>
        Lorem ipsum dolor
         sit amet consectetur
         adipisicing elit.

      <main> Content of page Realated Data Write in this Tag </main>

      <footer>Footer is a data of some specific data</footer>

      <!-- Inside Main Tag -->
       <section> for write section on your page</section>

       <article>For an artical on your page</article>

       <aside> For content aside main content</aside>
